# ovpn-agent: runs on the OpenVPN host, serves $OVPN_LISTEN.
# Copy to docker-compose.yml and .env.example to .env on the host (both are not in git).
# Values come from .env; add one volume line (and one .env variable) per OpenVPN profile.
# Folder on the host: docker-compose.yml + .env + data/agent.token (root:root 0600). Nothing else.
# Reads the management sockets only; mounts each profile's data/run/ read-only
# (never data/ itself: it holds the PKI).
#   check after install:  docker compose ps                    -> (healthy)
#                         docker compose exec agent /app -check -> all checks passed
name: ovpn-agent

services:
  agent:
    image: vihat/ovpn-agent:0.1.10
    restart: unless-stopped
    network_mode: host
    # uid 0 only to enter data/run (drwx------ root). cap_drop ALL leaves root with
    # no capabilities: it gets in as the directory owner, nothing more.
    user: "0:0"
    environment:
      OVPN_LISTEN: ${OVPN_LISTEN:?set OVPN_LISTEN in .env}
      # Access log (which VPN user opened which IP:port, when): the VPN client subnets,
      # e.g. 10.8.0.0/16. Empty = off. Needs the cap_add below.
      OVPN_FLOWS: ${OVPN_FLOWS:-}
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    # Only with OVPN_FLOWS: the kernel hands out its "new connection" events only with
    # NET_ADMIN. The agent only listens: it changes no firewall, route or interface.
    # cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data:/data:ro
      # <data/run directory on the host>:/srv/ovpn/<profile name>:ro
      - ${OVPN_RUN_PROFILE_A:?set in .env}:/srv/ovpn/profile-a:ro
      - ${OVPN_RUN_PROFILE_B:?set in .env}:/srv/ovpn/profile-b:ro
      # Optional, when OpenVPN has a client-connect hook writing data/log/history-YYYY-MM.log:
      # one per profile, same name as above (never data/ itself: it holds the PKI).
      # - type: bind
      #   source: ${OVPN_LOG_PROFILE_A:?set in .env}
      #   target: /srv/ovpn-log/profile-a
      #   read_only: true
      #   bind: { create_host_path: false }
    ulimits:
      nofile: { soft: 1024, hard: 4096 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
